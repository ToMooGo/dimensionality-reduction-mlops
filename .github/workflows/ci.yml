name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            services/pipeline/requirements.txt
            services/api/requirements.txt
            requirements-dev.txt
      - name: Install
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit + API tests (offline)
        run: python -m pytest -m "not integration" -q
      - name: Cache MNIST
        uses: actions/cache@v4
        with:
          path: data
          key: mnist-784-v1
      - name: Integration test (downloads MNIST, Prefect + MLflow on a subset)
        run: python -m pytest -m integration -q

  docker:
    name: Docker Compose end-to-end
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 40
    env:
      FLOW_CONFIG: configs/quick_flow_config.yaml
    steps:
      - uses: actions/checkout@v4
      - name: Run the pipeline as the runner user (it writes into ./reports)
        run: |
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Validate the compose file
        run: docker compose config --quiet
      - name: Build images
        run: docker compose build
      - name: Start infrastructure and API
        run: docker compose up -d --wait postgres mlflow prefect api
      - name: Train -> evaluate -> deploy (quick config)
        run: docker compose run --rm pipeline
      - name: Smoke test the deployed service
        run: |
          curl -fsS localhost:8000/ready
          python3 - <<'PY'
          import json, urllib.request
          base = "http://localhost:8000"
          def get(path):
              return json.load(urllib.request.urlopen(base + path))
          def post(path, body):
              req = urllib.request.Request(base + path, json.dumps(body).encode(), {"content-type": "application/json"})
              return json.load(urllib.request.urlopen(req))
          # schema and behaviour on several samples, not one lucky digit (quick model ~94% accurate)
          correct = 0
          for seed in range(10):
              s = get(f"/samples?kind=clean&seed={seed}")
              p = post("/predict", {"pixels": s["pixels"], "source": "ci"})
              assert set(p) >= {"raw", "pca", "unusual", "map_positions", "model_versions"}, p.keys()
              correct += p["pca"]["digit"] == s["true_label"]
          assert correct >= 8, f"only {correct}/10 clean samples classified correctly"
          noise = get("/samples?kind=noise&seed=1")
          assert post("/predict", {"pixels": noise["pixels"], "source": "ci"})["unusual"]["is_unusual"]
          c = post("/compress", {"pixels": s["pixels"], "n_components": 154})
          assert c["variance_kept"] > 0.94 and len(c["reconstruction"]) == 784, c
          print(f"smoke test ok: {correct}/10 correct, noise flagged, compress ok")
          PY
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
